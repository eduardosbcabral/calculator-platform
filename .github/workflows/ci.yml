name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Test Go API
        run: go test -race -coverprofile=coverage.out ./...

      - name: Vet Go API
        run: go vet ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint web application
        working-directory: frontend
        run: npm run lint

      - name: Test web application
        working-directory: frontend
        run: npm run test:coverage

      - name: Build web application
        working-directory: frontend
        run: npm run build

      - name: Build container
        run: docker build -t calculator-platform .

      - name: Smoke test container
        run: |
          docker run --detach --publish 8080:8080 --name calculator-platform calculator-platform
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/healthz
          curl --fail http://localhost:8080/
          curl --fail --header 'Content-Type: application/json' --data '{"operation":"percentage","left":15,"right":200}' http://localhost:8080/api/calculate

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            frontend/coverage/
